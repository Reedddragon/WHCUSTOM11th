name: One-time Dreadwing Alatreon migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-dreadwing-alatreon.yml'
permissions:
  contents: write
jobs:
  add-dreadwing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Fetch historical catalogue and apply narrow migration
        run: |
          git fetch origin backup-before-bsdata-sync-2026-10-25:refs/remotes/origin/backup-before-bsdata-sync-2026-10-25
          python3 .github/scripts/add-dreadwing-alatreon.py
      - name: Commit catalogues and retire one-time migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Imperium - Space Marines.json" "Imperium - Dark Angels.json" "WHCUSTOM11th Native Stratagems.json"
          git rm .github/scripts/add-dreadwing-alatreon.py .github/workflows/add-dreadwing-alatreon.yml
          git commit -m "Add Dreadwing Alatreon Protocol, native stratagems and historical units"
          git push origin HEAD:main
