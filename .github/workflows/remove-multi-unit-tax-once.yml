name: One-time remove duplicate-unit points taxes
on:
  push:
    paths:
      - '.github/workflows/remove-multi-unit-tax-once.yml'
permissions:
  contents: write
jobs:
  remove-taxes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove only repeat-unit points surcharges from all catalogues
        shell: bash
        run: |
          python3 - <<'PY'
          import copy
          import json
          import re
          from pathlib import Path

          PTS = '51b2-306e-1021-d207'
          pattern = re.compile(r'"field"\s*:\s*"51b2-306e-1021-d207"')

          def is_repeat_tax(mod):
              if not isinstance(mod, dict):
                  return False
              if mod.get('type') != 'increment' or mod.get('field') != PTS:
                  return False
              if not isinstance(mod.get('value'), (int, float)) or mod['value'] <= 0:
                  return False
              for group in mod.get('conditionGroups', []):
                  for local in group.get('localConditionGroups', []):
                      conditions = local.get('conditions', [])
                      if (local.get('field') == 'selections'
                          and local.get('scope') == 'parent'
                          and local.get('type') == 'atLeast'
                          and local.get('value', 0) >= 1
                          and any(c.get('type') == 'before' for c in conditions)
                          and any(c.get('type') == 'instanceOf' for c in conditions)):
                          return True
              return False

          def closing_brace(source, start):
              depth = 0
              quoted = False
              escaped = False
              for i in range(start, len(source)):
                  c = source[i]
                  if quoted:
                      if escaped:
                          escaped = False
                      elif c == '\\':
                          escaped = True
                      elif c == '"':
                          quoted = False
                  elif c == '"':
                      quoted = True
                  elif c == '{':
                      depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              raise ValueError('Unbalanced modifier object')

          def clean_expected(node):
              removed = 0
              if isinstance(node, list):
                  for child in node:
                      removed += clean_expected(child)
              elif isinstance(node, dict):
                  for key, value in list(node.items()):
                      if key == 'modifiers' and isinstance(value, list):
                          kept = [m for m in value if not is_repeat_tax(m)]
                          removed += len(value) - len(kept)
                          node[key] = kept
                      else:
                          removed += clean_expected(value)
              return removed

          files_changed = 0
          total_removed = 0
          for path in sorted(Path('.').glob('*.json')):
              original = path.read_text(encoding='utf-8')
              locations = []
              for match in pattern.finditer(original):
                  start = original.rfind('{', 0, match.start())
                  if start < 0:
                      raise ValueError(f'{path}: no modifier start')
                  end = closing_brace(original, start)
                  modifier = json.loads(original[start:end + 1])
                  if is_repeat_tax(modifier):
                      locations.append((start, end))
              if not locations:
                  continue
              edited = original
              for start, end in reversed(locations):
                  after = end + 1
                  while after < len(edited) and edited[after].isspace():
                      after += 1
                  if after < len(edited) and edited[after] == ',':
                      edited = edited[:start] + edited[after + 1:]
                  else:
                      before = start - 1
                      while before >= 0 and edited[before].isspace():
                          before -= 1
                      cut = before if before >= 0 and edited[before] == ',' else start
                      edited = edited[:cut] + edited[end + 1:]

              expected = json.loads(original)
              expected_removed = clean_expected(expected)
              actual = json.loads(edited)
              assert len(locations) == expected_removed, (path, len(locations), expected_removed)
              assert expected == actual, f'Unexpected JSON change in {path}'
              assert clean_expected(copy.deepcopy(actual)) == 0, f'Tax remains in {path}'
              path.write_text(edited, encoding='utf-8')
              files_changed += 1
              total_removed += expected_removed
              print(f'{path}: removed {expected_removed} repeat-unit points surcharges', flush=True)

          print(f'RESULT: {files_changed} files; {total_removed} repeat-unit surcharges removed', flush=True)
          assert total_removed > 0, 'No repeat-unit points surcharges were found'
          PY
      - name: Commit all catalogue changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.json'
          if ! git diff --cached --quiet; then
            git commit -m "Remove repeat-unit incremental points taxes across all factions"
            git push origin HEAD:main
          fi
