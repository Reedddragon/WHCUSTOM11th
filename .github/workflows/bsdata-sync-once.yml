name: One-time official BSData data sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bsdata-sync-once.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace custom catalogue data with current official upstream
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 https://github.com/BSData/wh40k-11e.git "$RUNNER_TEMP/wh40k-11e"
          python3 - <<'PY'
          import json, os, pathlib, shutil
          source = pathlib.Path(os.environ["RUNNER_TEMP"]) / "wh40k-11e"
          dest = pathlib.Path.cwd()
          official = sorted(source.glob("*.json"))
          if len(official) < 40:
              raise RuntimeError(f"Unexpected number of official data files: {len(official)}")
          for f in official:
              with f.open(encoding="utf-8") as fp:
                  json.load(fp)
          for f in dest.glob("*.json"):
              f.unlink()
          for f in official:
              shutil.copyfile(f, dest / f.name)
          for name in ("README.md", ".gitattributes", ".gitignore"):
              shutil.copyfile(source / name, dest / name)
          print(f"Validated and synchronized {len(official)} official JSON catalogues.")
          PY
          git rm --force .github/workflows/bsdata-sync-once.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          official_sha="$(git -C "$RUNNER_TEMP/wh40k-11e" rev-parse --short HEAD)"
          git commit -m "Sync 11th edition data from BSData/wh40k-11e @ $official_sha"
          git push origin HEAD:main
