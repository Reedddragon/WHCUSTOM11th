name: Inspect Custodes Stratagem Profiles
on:
  push:
    branches:
      - experiment/custodes-native-stratagems
    paths:
      - .github/workflows/probe-custodes.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List catalogue stratagem structures
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('Imperium - Adeptus Custodes.json').read_text())['catalogue']
          print('ROOT',list(c.keys()))
          ent=[];prof=[]
          def walk(x,anc=()):
            if isinstance(x,list):
              for z in x:walk(z,anc)
            elif isinstance(x,dict):
              name=x.get('name','')
              typ=x.get('typeName','')
              ln=anc+(str(name),) if isinstance(name,str) and name else anc
              if isinstance(name,str) and ('stratagem' in name.lower() or 'detach' in name.lower()) and ('typeName' not in x):
                if len(ent)<120:
                  ent.append({'name':name,'anc':ln[-4:],'p':len(x.get('profiles',[])),'e':len(x.get('selectionEntries',[])),'g':len(x.get('selectionEntryGroups',[]))})
              if isinstance(typ,str) and ('strat' in typ.lower() or ('strat' in str(name).lower())):
                cs=x.get('characteristics',[])
                if len(prof)<160:prof.append({'name':name,'type':typ,'anc':ln[-5:],'c':[{y.get('name'):str(y.get('$text',y.get('value','')))[:170]} for y in cs][:6]})
              for v in x.values():
                if isinstance(v,(dict,list)):walk(v,ln)
          walk(c)
          print('ENTRIES',json.dumps(ent,ensure_ascii=False)[:18000])
          print('PROFILES',json.dumps(prof,ensure_ascii=False)[:25000])
          PY

      - name: Inspect native book loader publicly available JS
        shell: bash
        run: |
          python - <<'PY'
          import re, urllib.request
          u='https://www.newrecruit.eu/_nuxt/C97lo6qo.js'
          try:
            req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
            js=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
            print('LOADER JS LENGTH',len(js))
            for pattern in ['loadExtraBooks','stratagems','105','data.custom','getBook','extraBooks']:
              spans=[m.start() for m in list(re.finditer(re.escape(pattern),js,re.I))[:5]]
              print('PATTERN',pattern,'MATCH COUNT',len(spans))
              for x in spans:
                print('JS_CTX',repr(js[max(0,x-240):x+350]))
          except Exception as e:
            print('JS INSPECT ERROR',type(e).__name__,str(e)[:500])
          PY

      - name: Find book fetch URL definitions
        shell: bash
        run: |
          python - <<'PY'
          import re,urllib.request
          js=urllib.request.urlopen('https://www.newrecruit.eu/_nuxt/C97lo6qo.js',timeout=20).read().decode()
          for p in ['bookFetch(','.bookFetch=','bookFetch:', 'bookFetch(e,t', 'getBookRaw(105','stratagemBook.stratagems']:
            print('FETCH_PATTERN',p)
            ix=[m.start() for m in re.finditer(re.escape(p),js,re.I)]
            print('COUNT',len(ix))
            for x in ix[:5]:
              print('FETCH_CTX',repr(js[max(0,x-800):x+1200]))
          PY
