name: One-time Custodes Suppressive Pass Shoot and Move
on:
  push:
    branches:
      - experiment/all-native-stratagems-20261106
    paths:
      - .github/workflows/update-custodes-suppressive-pass.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Change Suppressive Pass in main and native experimental branch
        shell: bash
        run: |
          cat > /tmp/update_suppressive.py <<'PY'
          import json
          from pathlib import Path

          path=Path("Imperium - Adeptus Custodes.json")
          raw=path.read_text(encoding="utf-8")
          data=json.loads(raw)
          sid="7e2f-1025-d107-0003"
          profiles=[]

          def find(x):
            if isinstance(x,list):
              for y in x:find(y)
            elif isinstance(x,dict):
              if x.get("id")==sid and x.get("typeName")=="Detachment Stratagems":
                profiles.append(x)
              for v in x.values():
                if isinstance(v,(list,dict)):find(v)
          find(data)
          assert len(profiles)==1,f"Expected exactly one matching stratagem, got {len(profiles)}"
          profile=profiles[0]
          assert profile.get("name")=="Suppressive Pass",profile.get("name")
          fields={c["name"]:c.get("$text") for c in profile["characteristics"]}
          assert fields["CP"]=="1 CP",fields
          expected_when="Your Shooting phase, just after a friendly ADEPTUS CUSTODES MOUNTED or VENATARI unit has shot."
          assert fields["When"]==expected_when,fields["When"]
          old_target="One enemy unit hit by one or more of that friendly unit's ranged attacks."
          old_effect="Until the end of the turn, that enemy unit cannot make Snap Shooting attacks against friendly ADEPTUS CUSTODES MOUNTED or VENATARI units."
          new_target="That friendly ADEPTUS CUSTODES MOUNTED or VENATARI unit."
          new_effect="Your unit can make a Normal move."
          assert fields["Target"]==old_target,fields["Target"]
          assert fields["Effect"]==old_effect,fields["Effect"]

          for before,after in ((old_target,new_target),(old_effect,new_effect)):
            encoded_before=json.dumps(before,ensure_ascii=False)
            assert raw.count(encoded_before)==1,(before,raw.count(encoded_before))
            raw=raw.replace(encoded_before,json.dumps(after,ensure_ascii=False),1)

          updated=json.loads(raw)
          up=[]
          def verify(x):
            if isinstance(x,list):
              for v in x: verify(v)
            elif isinstance(x,dict):
              if x.get("id")==sid and x.get("typeName")=="Detachment Stratagems":up.append(x)
              for v in x.values():
                if isinstance(v,(list,dict)):verify(v)
          verify(updated)
          assert len(up)==1
          cf={c["name"]:c["$text"] for c in up[0]["characteristics"]}
          assert cf["Target"]==new_target and cf["Effect"]==new_effect
          path.write_text(raw,encoding="utf-8")
          print("PATCH_OK Suppressive Pass: post-shooting Normal move; CP and timing unchanged")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main experiment/all-native-stratagems-20261106
          git checkout -B apply-suppressive-main origin/main
          python /tmp/update_suppressive.py
          git add 'Imperium - Adeptus Custodes.json'
          git diff --cached --numstat
          test "$(git diff --cached --numstat | awk '{print $1+$2}')" -le 8
          git commit -m "Custodes: Suppressive Pass allows a Normal move after shooting"
          git push origin HEAD:main
          git fetch origin experiment/all-native-stratagems-20261106
          git checkout -B apply-suppressive-test origin/experiment/all-native-stratagems-20261106
          python /tmp/update_suppressive.py
          git add 'Imperium - Adeptus Custodes.json'
          git diff --cached --numstat
          test "$(git diff --cached --numstat | awk '{print $1+$2}')" -le 8
          git commit -m "Custodes: sync Suppressive Pass shoot-and-move rule to native viewer branch"
          git push origin HEAD:experiment/all-native-stratagems-20261106
