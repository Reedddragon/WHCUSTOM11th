name: Diagnose Grav-Assault native stratagem matching
on:
  push:
    branches: [experiment/all-native-stratagems-20261106]
    paths: [.github/workflows/diagnose-grav-matching.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect catalogue and native matching functions
        run: |
          python - <<'PY'
          import json,urllib.request,re
          from pathlib import Path
          c=json.loads(Path('Imperium - Adeptus Custodes.json').read_text())['catalogue']
          print('CATALOGUE:',c.get('name'), 'CATID:',c.get('id'))
          def walk(x,anc=()):
            if isinstance(x,list):
              for v in x:walk(v,anc)
            elif isinstance(x,dict):
              nm=x.get('name','')
              if isinstance(nm,str) and nm in ('Grav-Assault Force','Aquilan Shield'):
                print('ENTRY',nm,'PATH',' > '.join(anc[-8:]),'ID',x.get('id'),'KEYS',list(x.keys()), 'COSTS',x.get('costs'), 'CATEGORIES',x.get('categoryLinks'))
                for key in ['modifiers','conditions','constraints','profiles','selectionEntries','selectionEntryGroups','entryLinks','infoLinks']:
                  y=x.get(key)
                  if y:print('ENTRY_DETAIL',key,json.dumps(y,ensure_ascii=False)[:1600])
              if isinstance(nm,str) and ('grav-assault' in nm.lower() or nm=="Detachment"):
                print('NAME_PATH',nm,'::',' > '.join(anc[-7:]), 'type',x.get('type',''))
              next_anc=anc+((nm,) if isinstance(nm,str) and nm else ())
              for v in x.values():
                if isinstance(v,(dict,list)):walk(v,next_anc)
          walk(c)
          d=json.loads(Path('WHCUSTOM11th Native Stratagems.json').read_text())['data']
          for group in ['Grav-Assault Force','Aquilan Shield']:
            rows=[s for s in d['custom']['Imperium - Adeptus Custodes'] if s.get('detachment')==group]
            print('NATIVE_ROWS',group,[(s['name'],s['id'],s['faction_id']) for s in rows])
          u='https://www.newrecruit.eu/_nuxt/C97lo6qo.js'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          js=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
          print('LOADER_BYTES',len(js))
          s=js.index('getRosterDetachment(e){')
          e=js.find('hasStratagems()',s)
          if e < 0:e=s+20000
          print('MATCHER_IMPLEMENTATION',js[s:min(e+1000,s+18000)])
          for key in ['getAllStratagems(){','getCustomStratagems(','useCustomStratagems(','getDetachmentStratagems(']:
            start=js.find(key, s-1200)
            if start<0:start=js.find(key)
            print('MATCHER_KEY',key,'INDEX',start,'CTX',js[start:start+2600] if start>=0 else '')
          PY

      - name: Inspect how roster options become detachment labels
        run: |
          python - <<'PY'
          import urllib.request,re,json
          u='https://www.newrecruit.eu/_nuxt/C97lo6qo.js'
          js=urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'}),timeout=25).read().decode('utf-8','replace')
          for needle in ['calcOptionsList(', 'calcOptionsList(e,t,s){', 'calcOptionsList(e=', 'getRosterDetachment(e){', 'stratagemCache[e]', 'type.startsWith("Core –")', 'getDetachmentStratagemsForDetachment(e,t){']:
            print('CHECK',needle,'hits',js.count(needle))
            for m in list(re.finditer(re.escape(needle),js))[-3:]:
              x=m.start()
              print('CHECK_CTX',needle,repr(js[max(0,x-300):x+2300]))
          PY

      - name: Inspect option serializer and exercise real native stratagem matcher
        run: |
          python - <<'PY'
          import urllib.request,re,json
          s=urllib.request.urlopen('https://www.newrecruit.eu/_nuxt/C97lo6qo.js',timeout=20).read().decode()
          locations=[m.start() for m in re.finditer(r'calcOptionsList\(',s)]
          print('OPTION_CALLS',len(locations))
          for i,x in enumerate(locations):
            print('OPTION_CONTEXT',i,repr(s[max(0,x-240):x+800]))
          matches=list(re.finditer(r'calcOptionsList\([^)]{0,150}\)\{',s))
          print('OPTION_METHOD_DEF_COUNT',len(matches))
          for m in matches:
            print('OPTION_METHOD_DEF',repr(s[m.start():m.start()+3500]))
          PY
      - name: Directly test New Recruit native matching method with generated records
        shell: bash
        run: |
          node <<'JS'
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('WHCUSTOM11th Native Stratagems.json','utf8')).data;
          (async () => {
            const js=await (await fetch('https://www.newrecruit.eu/_nuxt/C97lo6qo.js')).text();
            const marker='getDetachmentStratagemsForDetachment(e,t){';
            let start=js.indexOf(marker), end=js.indexOf('getPossibleLeaders(e)',start);
            if(start<0||end<0)throw Error('Cannot locate actual matching method');
            let body=js.slice(start,end);
            const Kt=x=>String(x??'').trim().toLowerCase();
            const yo=(a,b)=>a.name.localeCompare(b.name);
            const yV=x=>x.replace(/^(.*)\((.*)\)$/,(_,a,b)=>b+a);
            const matcher=eval('({'+body+'})');
            matcher.stratagemBook=data;
            const cat='Imperium - Adeptus Custodes';
            for(let det of ['Grav-Assault Force','Aquilan Shield','Dread Host']){
              const rows=matcher.getDetachmentStratagemsForDetachment(det,cat);
              console.log('NATIVE_MATCH',det,'found',rows.length,'cards',rows.map(x=>x.name).join(' | '));
              if(det==='Grav-Assault Force' && rows.length!==14)throw Error('Grav should have 3 custom +11 core');
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Inspect native Stratagems page UI selection and filters
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re
          base='https://www.newrecruit.eu/_nuxt/'
          for filename in ['rHZyuD3F.js','C97lo6qo.js']:
            req=urllib.request.Request(base+filename,headers={'User-Agent':'Mozilla/5.0'})
            src=urllib.request.urlopen(req,timeout=25).read().decode('utf-8','replace')
            print('UI_FILE',filename,'BYTES',len(src))
            needles=['getDetachmentStratagems','getRosterDetachment','getUnitStratagems','getAllStratagems','getStratagems','type.startsWith("Core','stratagems', 'Core –', 'core_stratagems','Core Stratagem','filter(']
            for needle in needles:
              matches=list(re.finditer(re.escape(needle),src,re.I))
              print('UI_HITS',filename,needle,len(matches))
              for m in matches[:5]:
                i=m.start()
                print('UI_SNIP',filename,needle,repr(src[max(0,i-500):i+1000]))
          PY

      - name: Search roster UI chunks for stratagem render filters
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,re,concurrent.futures,collections
          base='https://www.newrecruit.eu/_nuxt/'
          js=urllib.request.urlopen(base+'C97lo6qo.js',timeout=25).read().decode('utf8','replace')
          files=list(dict.fromkeys(re.findall(r'["\x27]\./([a-zA-Z0-9_~.-]+\.js)["\x27]',js)))
          print('CHUNK_COUNT',len(files))
          if len(files)>700: files=files[:700]
          markers=['getDetachmentStratagems','getUnitStratagems','getRosterDetachment','getStratagems','stratagemBook','coreStratagem','core_stratagem','Core –','Stratagems']
          def fetch(n):
            try:
              q=urllib.request.urlopen(urllib.request.Request(base+n,headers={'User-Agent':'Mozilla/5.0'}),timeout=10).read().decode('utf8','replace')
              hits=[m for m in markers if m in q]
              return n,len(q),q,hits
            except Exception as e:return n,0,'',[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=20) as ex:
            records=list(ex.map(fetch,files))
          print('FETCHED',sum(1 for x in records if x[1]),'of',len(records))
          important=[(n,sz,q,hits) for n,sz,q,hits in records if any(h in hits for h in markers[:8])]
          print('IMPORTANT',[(n,sz,hits) for n,sz,q,hits in important])
          for n,sz,q,hits in important[:25]:
            for needle in [x for x in hits if x in markers[:8]]:
              m=re.search(re.escape(needle),q)
              if m:print('CHUNK_MATCH',n,needle,repr(q[max(0,m.start()-500):m.start()+2400]))
          PY
