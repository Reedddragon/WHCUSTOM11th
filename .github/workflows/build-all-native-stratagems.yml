name: Build WHCUSTOM11th Native Stratagems (Experiment)
on:
  push:
    branches: [experiment/all-native-stratagems-20261106]
    paths:
      - '*.json'
      - '!WHCUSTOM11th Native Stratagems.json'
      - .github/scripts/build_native_stratagems.py
      - .github/workflows/build-all-native-stratagems.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate core and custom native Book 105 (experiment only)
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            "https://raw.githubusercontent.com/game-datacards/datasources/6f98bb1ce06e4dc2bed2c1c2cf27388cf7dbfa6a/11th/gdc/core.json" \
            -o /tmp/whcustom-core-11e.json
          python .github/scripts/build_native_stratagems.py --core-source /tmp/whcustom-core-11e.json --experimental-incomplete-base
      - name: Validate all source stratagems and placement
        run: |
          python - <<'PY'
          import collections,json
          d=json.load(open('WHCUSTOM11th Native Stratagems.json',encoding='utf8'))['data']
          custom=d['custom']
          assert len(custom)>=4,custom.keys()
          totals={cat:len(rows) for cat,rows in custom.items() if cat in (
            'Imperium - Adeptus Custodes',
            'Imperium - Adeptus Astartes - Space Marines',
            'Xenos - Orks',
            'Xenos - Necrons',
          )}
          assert len(custom['Imperium - Adeptus Astartes - Dark Angels'])==154
          # Deathwing Protocol must use the same name in both catalogue and native viewer.
          dw=[r for r in custom['Imperium - Adeptus Astartes - Dark Angels'] if r['detachment']=='Deathwing Protocol']
          assert len(dw)==6,[r['name'] for r in dw]
          assert {r['name'] for r in dw}=={
            'Armour of Vengeance',
            'Deathwing Teleportarium',
            'Blades of Caliban',
            'Maximux Protocol',
            'Undying Shield',
            'Wrath of the Lion',
          }
          assert all('Xanax System' not in r['detachment'] for r in d['stratagems'])
          assert sum(r['detachment']=='Deathwing Protocol' for r in custom['Imperium - Adeptus Astartes - Space Marines'])==6
          rw=[r for r in custom['Imperium - Adeptus Astartes - Dark Angels'] if r['detachment']=='Ravenwing Protocol']
          assert len(rw)==6,[r['name'] for r in rw]
          assert {r['name'] for r in rw}=={
            "Hunters' Trail",
            'On Black Wings of the Raven',
            "Raven's Swiftness",
            'Ride Hard, Ride Fast',
            'Full Throttle',
            'Black Strike',
          }
          assert all(r['cp_cost']==1 for r in rw)
          assert sum(r['detachment']=='Ravenwing Protocol' for r in custom['Imperium - Adeptus Astartes - Space Marines'])==6
          assert totals=={
            'Imperium - Adeptus Custodes':42,
            'Imperium - Adeptus Astartes - Space Marines':154,
            'Xenos - Orks':47,
            'Xenos - Necrons':3,
          },totals
          assert len(d['stratagems'])==sum(totals.values())+11==257
          core=[r for r in d['stratagems'] if r['type'].startswith('Core –')]
          assert len(core)==11
          assert len({r['name'] for r in core})==11
          assert all(r['detachment']=='' and r['faction_id']=='' for r in core)
          assert all(r['id'] and r['cp_cost']>0 and r['phase'] and r['turn'] for r in core)
          assert any(r['name']=='Heroic Intervention' and 'ALTERNATIVE' in r['description'] for r in core)
          assert any(r['name']=='Insane Bravery' and 'RESTRICTIONS' in r['description'] for r in core)
          assert any(r['name']=='New Orders' for r in core)
          assert next(r['phase'] for r in core if r['name']=='Insane Bravery')=='Command phase'
          assert next(r['cp_cost'] for r in core if r['name']=='Counteroffensive')==2
          assert not any(r['detachment'] for r in core)
          for cat, rows in custom.items():
            for r in rows:
              assert r['id'] and r['detachment'] and r['cp_cost']>0
              assert r['description'].count('<b>WHEN:</b>')==1
              assert r['description'].count('<b>TARGET:</b>')==1
              assert r['description'].count('<b>EFFECT:</b>')==1
          print('PASS 11 core + 246 custom native stratagem validation',totals)
          PY
      - name: Commit test Book 105
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "WHCUSTOM11th Native Stratagems.json"
          if ! git diff --cached --quiet; then
            git commit -m "Generate 11 core and 240 native custom stratagems"
            git push
          fi
